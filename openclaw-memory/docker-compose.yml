services:
  postgres:
    build: .
    image: openclaw-memory-postgres:16.15-pgvector0.8.2-20261023
    container_name: openclaw-memory-postgres
    restart: unless-stopped
    env_file:
      - ./config/memory.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1536m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
